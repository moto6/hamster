# jpa : 영속성 비교 학습용 오버레이 프로파일. 단독으로 쓰지 않고 환경 프로파일에 얹는다.
#   실행 예) --spring.profiles.active=local,jpa
#
# BookOutPort 구현만 R2DBC → JPA 로 바뀐다. auth 등 나머지는 그대로 R2DBC 를 쓴다.
# 이 프로파일이 없으면 JDBC DataSource 가 없어 JPA 오토컨피그 전체가 backs off 하므로
# 기본 경로에는 어떤 영향도 주지 않는다.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/library}
    username: ${SPRING_DATASOURCE_USERNAME:hamster}
    password: ${SPRING_DATASOURCE_PASSWORD:hamster}
    hikari:
      # R2DBC 풀과 조건을 맞춰두면 나중에 수치를 볼 때 풀 크기 차이에 속지 않는다.
      maximum-pool-size: ${JPA_POOL_SIZE:10}
  jpa:
    # 스키마 주인은 Flyway 다. Hibernate 는 매핑이 스키마와 맞는지 검증만 한다.
    hibernate:
      ddl-auto: validate
    # WebFlux 에는 OSIV 자체가 없지만, 의도를 명시해 둔다.
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
