plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    // JPA 엔티티(@Entity)에 no-arg 생성자를 합성한다. Hibernate 가 리플렉션으로 인스턴스화하려면 필수.
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Hibernate 프록시/지연로딩은 엔티티 클래스가 final 이면 동작하지 않는다.
// kotlin-spring 프리셋에는 @Entity 가 없으므로 직접 열어준다.
allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'hamster-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(project(":foundation"))
    implementation(project(":library-core"))

    implementation("org.springframework.boot:spring-boot-starter-webflux")
    implementation("org.springframework.boot:spring-boot-starter-data-r2dbc")
    // 영속성 비교 학습용. 기본(local/dev/prod)에서는 오토컨피그가 제외되어 아무것도 뜨지 않고,
    // 'jpa' 프로파일에서만 활성화된다. application.yml 의 spring.autoconfigure.exclude 참고.
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")


    implementation("org.jetbrains.kotlin:kotlin-reflect")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-reactor")
    implementation("io.projectreactor.kotlin:reactor-kotlin-extensions")
    implementation("tools.jackson.module:jackson-module-kotlin")

    implementation("io.jsonwebtoken:jjwt-api:0.13.0")
    implementation("io.jsonwebtoken:jjwt-impl:0.13.0")
    implementation("io.jsonwebtoken:jjwt-jackson:0.13.0")

    // OpenAPI(Swagger UI, WebFlux) — /swagger-ui.html 로 API 문서 자동 노출. (Spring Boot 4 / Spring 7 라인)
    implementation("org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.2")

    // 참고: SSO code↔token 교환에 쓰는 WebClient 는 이미 spring-boot-starter-webflux 에 포함되어 있어
    // 별도 의존성이 필요 없다. (validation 스타터를 추가했었으나 @Valid 사용처가 없어 제거)

    runtimeOnly("org.postgresql:r2dbc-postgresql")
    runtimeOnly("org.postgresql:postgresql")

    testImplementation("org.springframework.boot:spring-boot-starter-webflux-test")
    testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    implementation("org.flywaydb:flyway-core")
    implementation("org.flywaydb:flyway-database-postgresql")
    implementation("org.springframework.boot:spring-boot-starter-jdbc")
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

