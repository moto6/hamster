server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # API 는 백엔드(hamster-back)로 프록시 → 브라우저 입장에선 same-origin.
    # 인증 refresh-token 이 HttpOnly 쿠키(path=/api/v0/auth)라 same-origin 프록시가 필수.
    location /api/ {
        proxy_pass http://hamster-back:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 에셋 캐시 (해시 파일명이라 장기 캐시 가능)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router(SPA): 실제 파일이 없으면 index.html 로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
